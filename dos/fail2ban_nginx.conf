# Jail de fail2ban para Nginx (producción)
# Copiar a /etc/fail2ban/jail.d/nginx.local  y reiniciar fail2ban

[nginx-limit-req]
enabled = true
filter = nginx-limit-req
logpath = /var/log/nginx/error.log
findtime = 60         # ventana de observación (s)
maxretry = 5          # veces que dispara 429/limit_req
bantime = 3600        # 1h de bloqueo
action = iptables-multiport[name=nginx, port="http,https"]

[nginx-http-auth]
enabled = true
filter = nginx-http-auth
logpath = /var/log/nginx/error.log
maxretry = 6
bantime = 3600
action = iptables-multiport[name=nginx-auth, port="http,https"]

# Después:
#   sudo systemctl restart fail2ban
#   sudo fail2ban-client status nginx-limit-req