# Template de protección DoS para Nginx (producción)
# Aplicar en el bloque `http {}` o conf de servidor. Ajusta valores a tu tráfico real.

# --- Rate limiting por IP ---
limit_req_zone $binary_remote_addr zone=req_per_ip:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=conn_per_ip:10m;

server {
    listen 80;
    server_name tusitio.com;

    # --- Protección por peticiones/segundo (HTTP flood) ---
    # burst: permite ráfagas cortas; nodelay: responde ya pero cuenta
    location / {
        limit_req zone=req_per_ip burst=40 nodelay;
        limit_conn conn_per_ip 30;
        limit_req_status 429;               # Too Many Requests

        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- Freno a la fuerza bruta en login ---
    location ~* ^/login {
        limit_req zone=req_per_ip burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
    }

    # --- Timeouts agresivos (contra slowloris) ---
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 10s;
    keepalive_timeout 20s;
    client_max_body_size 2m;
}

# Para slowloris además: 
#   proxy_read_timeout 10s;
#   proxy_send_timeout 10s;
# y subir si usas websockets (nariz: WS necesita timeouts altos).